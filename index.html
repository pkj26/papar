    <title>Snap2Print - Image to HTML Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              }
            }
          }
        }
      }
    </script>
    <!-- Google Fonts: Kalam for Handwriting effect -->

    <style>
      @media print {
        body {
          print-color-adjust: exact;
          -webkit-print-color-adjust: exact;
        }
        .no-print {
          display: none !important;
        }
        .print-page {
          break-after: page;
          page-break-after: always;
          height: 100vh;
          width: 100%;
        }
        /* Reset margins for print to maximize space */
        @page {
          margin: 0;
        }
      }
      /* Custom scrollbar for better aesthetics */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1; 
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8; 
      }
    </style>
